<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 py-10 px-4">
  <div class="container mx-auto max-w-6xl space-y-10">
    
    <!-- Title -->
    <h1 class="text-4xl font-extrabold text-center text-blue-900 drop-shadow">
      🌍 ค้นหาสถานที่ท่องเที่ยว
    </h1>

    <!-- Search & Filters -->
    <div class="bg-white shadow-md rounded-xl p-6 space-y-6">
      
      <!-- แถวค้นหา -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- ค้นหา ID -->
        <div class="flex items-end gap-2" >
          <mat-form-field class="flex-1 "  >
            <mat-label>ค้นหา ID</mat-label>
            <input matInput #keyword />
          </mat-form-field>
          <button mat-mini-fab color="primary" class="mb-7" (click)="findOne(keyword)">
            <mat-icon>search</mat-icon>
          </button>
        </div>

        <!-- ค้นหาชื่อ -->
        <div class="flex items-end gap-2">
          <mat-form-field class="flex-1">
            <mat-label>ค้นหาชื่อ</mat-label>
            <input matInput #name />
          </mat-form-field>
          <button mat-mini-fab color="primary" class="mb-7" (click)="findName(name)">
            <mat-icon>search</mat-icon>
          </button>
        </div>

        <!-- ลบด้วย ID -->
        <div class="flex items-end gap-2">
          <mat-form-field class="flex-1">
            <mat-label>ลบด้วย ID</mat-label>
            <input matInput #deleteId />
          </mat-form-field>
          <button mat-mini-fab color="warn" class="mb-7" (click)="Delete(+deleteId.value)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <!-- แถวฟิลเตอร์ -->
      <div class="justify-center  flex flex-col md:flex-row md:items-center  gap-6">
        <mat-form-field >
          <mat-label>เลือกประเทศ</mat-label>
          <mat-select [(value)]="selectedCountry" (selectionChange)="onCountryChange($event)">
            <mat-option *ngFor="let c of countries" [value]="c">{{ c }}</mat-option>
          </mat-select>
        </mat-form-field>

       
      </div>

      <!-- ปุ่มโหลดข้อมูล -->
      <div class="text-center">
        <button mat-raised-button color="primary" (click)="callApi()" 
          class="px-8 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md">
          🚀 โหลดข้อมูลทั้งหมด
        </button>
        <button mat-raised-button color="accent" [routerLink]="['/postput']"
    class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md shadow">
    ➕ เพิ่มข้อมูล
  </button>
      </div>
    </div>

    <!-- Trip List -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <div *ngIf="trips.length === 0" 
           class="col-span-full text-center text-red-500 text-xl font-semibold">
        ❌ ไม่พบข้อมูลทริป
      </div>

      <!-- Card -->
      <div *ngFor="let trip of trips" 
           class="bg-white rounded-xl shadow-md hover:shadow-xl transition overflow-hidden flex flex-col">
        
        <img *ngIf="trip.coverimage" 
             [src]="trip.coverimage" 
             (error)="onImageError($event)"
             alt="{{ trip.name }}" 
             class="w-full h-48 object-cover" />

        <div class="p-4 flex-1 flex flex-col">
          <h2 class="text-xl font-bold text-blue-800 mb-2 truncate">📍 {{ trip.name }}</h2>
          <p class="text-gray-700 mb-1">🌍 ประเทศ: {{ trip.country }}</p>
          <p class="text-gray-700 mb-1">🗺️ ทวีป: {{ trip.destinationName }}</p>
          <p class="text-gray-600 flex-1">📝 {{ trip.detail }}</p>
          
          <div class="mt-4 space-y-1">
            <p class="text-green-700 font-semibold">💸 {{ trip.price | number }} บาท</p>
            <p class="text-purple-700 font-semibold">🕒 {{ trip.duration }} วัน</p>
          </div>

          <a [routerLink]="['/Detail', trip.idx]" 
             class="mt-4 inline-block px-4 py-2 bg-blue-600 text-white text-center rounded-lg hover:bg-blue-700 transition">
            🔍 ดูรายละเอียด
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
