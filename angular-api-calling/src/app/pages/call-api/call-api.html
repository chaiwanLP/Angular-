<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 py-10 px-4">
  <div class="container mx-auto max-w-5xl space-y-8">
    <!-- Title -->
    <h1 class="text-4xl font-bold text-center text-blue-800">🌍 ค้นหาสถานที่ท่องเที่ยว</h1>

    <div class="flex justify-center">
      <button mat-raised-button color="primary" (click)="callApi()"
        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md shadow">
        🚀 โหลดข้อมูลทั้งหมด
      </button>
    </div>

    <div class="flex flex-wrap items-end gap-4  justify-center">
      <mat-form-field >
        <mat-label>ค้นหา ID</mat-label>
        <input matInput #keyword />
      </mat-form-field>
      <button class="mb-8" mat-icon-button color="primary" (click)="findOne(keyword)">
        <mat-icon>search</mat-icon>
      </button>

      <mat-form-field  >
        <mat-label>ค้นด้วยชื่อ</mat-label>
        <input matInput #name />
      </mat-form-field >
      <button class="mb-8" mat-icon-button color="primary" (click)="findName(name)">
        <mat-icon>search</mat-icon>
      </button>

       <mat-form-field>
        <mat-label>ลบด้วย ID</mat-label>
        <input matInput #deleteId />
      </mat-form-field>
      <button class="mb-8" mat-icon-button color="warn" (click)="Delete(+deleteId.value)">
        <mat-icon>delete</mat-icon>
      </button>

      
     <mat-form-field >
        <mat-label>เลือกประเทศ</mat-label>
        <mat-select [(value)]="selectedCountry" (selectionChange)="onCountryChange($event)">
          <mat-option *ngFor="let c of countries" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>
     

    </div>

    <!-- Trip List -->
    <div class="grid grid-cols-1 gap-4 pt-6">
      <div *ngIf="trips.length === 0" class="text-center text-red-500 text-xl font-semibold">
        ❌ ไม่พบข้อมูลทริป
      </div>

      <!-- รายการสถานที่ -->
      <div *ngFor="let trip of trips" class="bg-white rounded-lg shadow p-4 mb-6 max-w-3xl mx-auto">
        <img *ngIf="trip.coverimage" [src]="trip.coverimage" (error)="onImageError($event)"
          alt="รูปภาพของ {{ trip.name }}" class="w-full h-60 object-cover rounded-md mb-4 border" />

        <h2 class="text-2xl font-bold text-blue-800 mb-2">📍 {{ trip.name }}</h2>
        <p class="text-gray-700 mb-1">🌍 ประเทศ: {{ trip.country }}</p>
        <!-- <p class="text-gray-700 mb-1">🗺️ ทวีป: {{ trip.destinationid }}</p> -->
        <p class="text-gray-600 mb-2">📝 รายละเอียด: {{ trip.detail }}</p>
        <p class="text-green-700 font-semibold">💸 ราคา: {{ trip.price | number }} บาท</p>
        <p class="text-purple-700 font-semibold">🕒 ระยะเวลา: {{ trip.duration }} วัน</p>

        <a [routerLink]="['/Detail', trip.idx]"
          class="inline-block mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
          🔍 ดูรายละเอียด
        </a>
      </div>
    </div>
  </div>
</div>
