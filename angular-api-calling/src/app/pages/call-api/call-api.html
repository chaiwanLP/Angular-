<div class="flex flex-col items-center p-6 space-y-4 bg-gray-50 min-h-screen">

  <!-- หัวข้อ -->
  <h2 class="text-2xl font-semibold text-gray-800">🎯 Trip API Interface</h2>

  <!-- ปุ่ม Call API -->
  <button mat-raised-button color="primary" (click)="callApi()" class="w-48">
    🚀 Call API
  </button>

  <!-- FindOne -->
  <div class="flex items-center gap-2">
    <mat-form-field  class="w-60">
      <mat-label>ID</mat-label>
      <input matInput #keyword placeholder="Enter ID to Find" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="findOne(keyword)">
      🔍 FindOne
    </button>
  </div>

  <!-- FindName -->
  <div class="flex items-center gap-2">
    <mat-form-field  class="w-60">
      <mat-label>Name</mat-label>
      <input matInput #name placeholder="Enter Name to Find" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="findName(name)">
      🔍 FindName
    </button>
  </div>

  <!-- Delete -->
  <div class="flex items-center gap-2">
    <mat-form-field  class="w-60">
      <mat-label>Delete by ID</mat-label>
      <input matInput #deleteId placeholder="Enter ID to Delete" />
    </mat-form-field>
    <button mat-raised-button color="warn" (click)="Delete(+deleteId.value)">
      🗑️ Delete
    </button>
  </div>

  <!-- แสดงผล Trip -->
  <div class="w-full max-w-xl mt-6">
    <h2 class="text-xl font-medium text-green-700" *ngFor="let trip of trips">
      Idx :{{ trip.idx }} — 📍 {{ trip.name }}
</h2>

    <h2 class="text-red-500 text-center" *ngIf="trips.length === 0">
      ❌ No Data
    </h2>
  </div>

</div>
