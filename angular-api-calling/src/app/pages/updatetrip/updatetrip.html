<div class="flex flex-col items-center w-full max-w-md mx-auto mt-10 space-y-4">

  <!-- 🔍 ค้นหา Trip -->
  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Trip ID</label>
    <input
      #tripId
      type="number"
      class="w-full border border-gray-300 rounded px-3 py-2"
      placeholder="กรอก Trip ID"
    />
  </div>

  <button
    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
    (click)="findOne(tripId)"
  >
    Load Trip
  </button>

  <!-- แสดงชื่อ Trip -->
  <div *ngIf="Trips.length > 0" class="text-lg font-semibold text-center">
    Loaded: {{ Trips[0].name }}
  </div>

  <!-- 📋 ฟอร์มอัปเดตข้อมูล -->
  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Name</label>
    <input [(ngModel)]="name" class="w-full border px-3 py-2 rounded" />
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Destination</label>
    <select [(ngModel)]="destination" class="w-full border px-3 py-2 rounded">
      <option *ngFor="let d of destinations" [value]="d.value">
        {{ d.name }}
      </option>
    </select>
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Country</label>
    <input [(ngModel)]="country" class="w-full border px-3 py-2 rounded" />
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Cover Image URL</label>
    <input [(ngModel)]="cover" class="w-full border px-3 py-2 rounded" />
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Detail</label>
    <input [(ngModel)]="detail" class="w-full border px-3 py-2 rounded" />
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Price</label>
    <input type="number" [(ngModel)]="price" class="w-full border px-3 py-2 rounded" />
  </div>

  <div class="w-full">
    <label class="block text-sm font-medium mb-1">Duration (days)</label>
    <input [(ngModel)]="duration" class="w-full border px-3 py-2 rounded" />
  </div>

  <button
    class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition"
    (click)="updateTrip()"
  >
    Update Trip
  </button>
</div>
