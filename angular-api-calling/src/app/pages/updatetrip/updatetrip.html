<div class="min-h-screen bg-blue-50 py-10 px-4">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-3xl font-bold text-blue-800 mb-6 text-center">✏️ แก้ไขข้อมูลทริป</h2>

    <div class="flex gap-4 items-end mb-6">
      <mat-form-field class="flex-1">
        <mat-label>ใส่ Trip ID</mat-label>
        <input matInput #tripInput placeholder="เช่น 1, 2, 3..." />
      </mat-form-field>

      <button class="mb-7" mat-icon-button color="primary" (click)="findOne(tripInput)">
        <mat-icon>search</mat-icon>
      </button>
    </div>

    <form *ngIf="tripId !== null" class="space-y-4">
      <!-- ชื่อ -->
      <mat-form-field class="w-full">
        <mat-label>ชื่อทริป</mat-label>
        <input matInput [(ngModel)]="name" name="name" />
      </mat-form-field>

      <!-- ประเทศ -->
      <mat-form-field class="w-full">
        <mat-label>ประเทศ</mat-label>
        <input matInput [(ngModel)]="country" name="country" />
      </mat-form-field>

      <!-- ทวีป -->
      <mat-form-field class="w-full">
        <mat-label>เลือกทวีป</mat-label>
        <mat-select [(ngModel)]="destination" name="destination">
          <mat-option *ngFor="let d of destinations" [value]="d.value">
            {{ d.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Cover -->
      <mat-form-field class="w-full">
        <mat-label>URL รูปภาพหน้าปก</mat-label>
        <input matInput [(ngModel)]="cover" name="cover" />
      </mat-form-field>

      <!-- รายละเอียด -->
      <mat-form-field class="w-full">
        <mat-label>รายละเอียด</mat-label>
        <textarea matInput rows="3" [(ngModel)]="detail" name="detail"></textarea>
      </mat-form-field>

      <!-- ราคา -->
      <mat-form-field class="w-full">
        <mat-label>ราคา</mat-label>
        <input matInput type="number" [(ngModel)]="price" name="price" />
      </mat-form-field>

      <!-- ระยะเวลา -->
      <mat-form-field class="w-full">
        <mat-label>ระยะเวลา (วัน)</mat-label>
        <input matInput type="number" [(ngModel)]="duration" name="duration" />
      </mat-form-field>

      <!-- ปุ่มบันทึก -->
      <div class="text-center pt-4">
        <button mat-raised-button color="primary" (click)="updateTrip()"
          class="px-6 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700">
          💾 บันทึกข้อมูล
        </button>
      </div>

      <!-- ปุ่มกลับ -->
      <div class="text-center mt-6">
      <a href="/" 
         class="inline-flex items-center gap-2 px-6 py-2 border border-blue-600 text-blue-600 rounded-md hover:bg-blue-50 transition">
        <mat-icon>arrow_back</mat-icon> กลับหน้าหลัก
      </a>
    </div>
    </form>
  </div>
</div>
