<div style="display: flex; flex-direction: column; align-items: center; width: 100vw">
  <!-- ใส่ Trip ID เพื่อค้นหา -->
  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Trip ID</mat-label>
    <input matInput type="number" [(ngModel)]="tripId" />
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="fetchTrip()" style="width: 200px; margin-bottom: 20px;">
    Load Trip
  </button>

  <!-- Form ข้อมูล Trip -->
  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Destination</mat-label>
    <mat-select [(ngModel)]="destination">
      <mat-option *ngFor="let d of destinations" [value]="d.value">
        {{ d.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Country</mat-label>
    <input matInput [(ngModel)]="country" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Cover Image</mat-label>
    <input matInput [(ngModel)]="cover" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Detail</mat-label>
    <input matInput [(ngModel)]="detail" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Price</mat-label>
    <input matInput type="number" [(ngModel)]="price" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 200px">
    <mat-label>Duration</mat-label>
    <input matInput [(ngModel)]="duration" />
  </mat-form-field>

  <button mat-raised-button color="accent" (click)="updateTrip()" style="width: 200px; margin-top: 10px;">
    Update Trip
  </button>
</div>
